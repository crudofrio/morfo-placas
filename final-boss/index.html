<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07060f">
<title>FINAL BOSS · Morfo III Práctica</title>
<style>
:root{
  --bg:#07060f; --card:#14102a; --line:#ffffff1f;
  --cyan:#00e6c3; --mag:#ff3d8a; --yel:#ffd166; --pur:#8b6cff;
  --ok:#2ee59d; --bad:#ff4d6d; --dim:#9b97b8; --text:#f6f4ff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  min-height:100dvh;overflow-x:hidden}
body{background:radial-gradient(900px 500px at 0% -10%,#ff3d8a22,transparent 50%),
  radial-gradient(800px 400px at 120% 0%,#00e6c326,transparent 45%),var(--bg);
  padding:calc(8px + var(--safe-t)) 12px calc(14px + var(--safe-b))}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
#app{max-width:430px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.brand{flex:1;min-width:0}
.brand .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);font-weight:800}
.brand h1{font-size:26px;font-weight:900;letter-spacing:.02em;
  background:linear-gradient(90deg,var(--yel),#fff,var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent}
.ib{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:#ffffff10;display:grid;place-items:center;flex-shrink:0}
.ib.on{border-color:var(--cyan)}
.lead{color:var(--dim);font-size:14px;line-height:1.4;margin:4px 0 10px}
.pulse{display:block;width:100%;border:0;border-radius:20px;padding:16px;margin:8px 0 12px;
  font-size:20px;font-weight:900;letter-spacing:.03em;text-transform:uppercase;color:#1a0a16;
  background:linear-gradient(135deg,var(--yel),#ff9e2c 45%,var(--mag));
  box-shadow:0 8px 24px #ff3d8a55}
.pulse small{display:block;font-size:12px;font-weight:700;letter-spacing:0;text-transform:none;margin-top:2px;opacity:.85}
.pulse.alt{background:linear-gradient(135deg,var(--cyan),#3d7dff);color:#041018;box-shadow:0 8px 24px #00e6c355;font-size:18px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:#1a1633;border-radius:999px;padding:8px 12px;font-weight:800;font-size:13px;min-height:40px}
.chip.on{border-color:var(--cyan);background:#123;color:var(--cyan)}
.lv{display:grid;gap:8px;margin:10px 0}
.lvc{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);
  background:linear-gradient(180deg,#1a1434,#120e28);border-radius:16px;padding:12px;min-height:68px}
.lvc.on{border-color:var(--cyan)}
.lvc.locked{opacity:.55}
.lvc .n{width:36px;height:36px;border-radius:12px;background:#ffffff14;display:grid;place-items:center;font-weight:900;flex-shrink:0}
.lvc b{display:block;font-size:15px}
.lvc span{display:block;font-size:12px;color:var(--dim);margin-top:2px;line-height:1.3}
.lock{margin-left:auto;font-size:16px}
.stats{display:flex;gap:8px;margin:8px 0}
.stat{flex:1;background:#ffffff0c;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font-size:16px;color:var(--yel)}
.stat span{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.ghost{width:100%;border:1px solid var(--line);background:#ffffff0c;border-radius:14px;padding:12px;font-weight:800;min-height:46px}
.go{display:block;width:100%;border:0;border-radius:16px;padding:14px;margin:8px 0;font-size:17px;font-weight:900;
  background:linear-gradient(135deg,var(--cyan),#3d7dff);color:#041018}
.go.alt{background:#ffffff12;color:#fff;border:1px solid var(--line)}
.foot{font-size:11px;color:#6f6a8d;text-align:center;margin-top:14px;line-height:1.4}
a{color:var(--cyan)}
.hud{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;margin-bottom:6px}
.hud .sp{margin-left:auto;color:var(--cyan);font-variant-numeric:tabular-nums}
.lives{color:var(--mag)}
.combo{color:var(--yel)}
.bar{height:7px;border-radius:99px;background:#ffffff14;overflow:hidden;margin-bottom:8px}
.bar>i{display:block;height:100%;width:100%;transform-origin:left center;background:linear-gradient(90deg,var(--ok),var(--yel),var(--mag))}
.bar.low>i{background:var(--bad)}
.bar.off{opacity:.35}
.bar.off>i{transform:scaleX(0);background:#ffffff33}
.prompt{font-size:16px;font-weight:800;line-height:1.25;margin:0 0 8px}
.sub{font-size:12px;color:var(--dim);margin:-4px 0 8px}
.stick{position:sticky;top:calc(-8px - var(--safe-t));z-index:8;background:var(--bg);
  margin:0 -12px;padding:calc(4px + var(--safe-t)) 12px 8px;
  box-shadow:0 10px 18px #07060fee}
.imgw{position:relative;border-radius:14px;overflow:hidden;background:#0a0a12;border:1px solid var(--line);
  box-shadow:0 8px 22px #0008;margin-bottom:0;min-height:140px}
.imgw img.placa{display:block;width:100%;height:auto;max-height:38dvh;object-fit:contain;background:#000;min-height:120px}
.imgw .tag{position:absolute;left:8px;bottom:8px;top:auto;background:#07060fcc;border:1px solid #ffffff33;
  border-radius:99px;padding:3px 8px;font-size:11px;font-weight:800;color:var(--cyan);z-index:1}
.imgw .mark{position:absolute;width:28px;height:28px;border-radius:50%;transform:translate(-50%,-50%);
  background:#ff3d8a;border:2px solid #ffd166;color:#fff;font-weight:900;font-size:13px;
  display:grid;place-items:center;box-shadow:0 0 0 2px #0008;pointer-events:none;z-index:2}
.imgw .zonebox{position:absolute;border:3px dashed #00e6c3;background:rgba(0,230,195,.18);
  border-radius:10px;pointer-events:none;z-index:1}
.imgw .img-err{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:8px;
  background:#000c;text-align:center;padding:16px;z-index:4;font-weight:800}
.opts{display:grid;gap:7px}
.opt,.tchip{width:100%;text-align:left;border-radius:14px;border:1px solid var(--line);
  background:#1a1433;padding:11px 12px;min-height:52px;font-size:13.5px;font-weight:700;line-height:1.3}
.opt.ok,.tchip.ok{background:#0d3a22;border-color:var(--ok);color:var(--ok)}
.opt.bad,.tchip.bad{background:#3a0d1c;border-color:var(--bad);color:#ffb3c5}
.opt.lock{pointer-events:none}
.tchip.on{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
.tchip.miss{border-style:dashed}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips .tchip{width:auto;min-height:44px;padding:8px 10px;font-size:13px}
.fb{border-radius:16px;padding:10px;margin:8px 0;border:1px solid var(--line);background:#160b28}
.fb.good{border-color:var(--ok);background:#0a2418}
.fb.nope{border-color:var(--bad);background:#2a0a14}
.fb h3{font-size:15px;margin-bottom:4px}
.fb .dx{font-weight:800;color:var(--yel);font-size:14px;line-height:1.3}
.fb .els{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.35}
.tap{text-align:center;font-size:12px;color:var(--dim);margin-top:6px}
.results{text-align:center;padding:8px 2px}
.results h2{font-size:28px;margin:8px 0;background:linear-gradient(90deg,var(--yel),var(--mag));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.bigscore{font-size:46px;font-weight:900;color:var(--cyan)}
.results p{color:var(--dim);margin:4px 0 8px}
.miss{text-align:left;margin:10px 0;font-size:13px}
.miss div{padding:7px 0;border-bottom:1px solid var(--line)}
.count{display:grid;place-items:center;min-height:70dvh;text-align:center}
.count b{font-size:110px;line-height:1;color:var(--yel)}
.srow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);
  background:#14102a;border-radius:14px;padding:10px;margin:0 0 7px}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.dot.green{background:#2ee59d;box-shadow:0 0 8px #2ee59d}
.dot.gold{background:#ffd166}
.dot.red{background:#ff4d6d;box-shadow:0 0 8px #ff4d6d88}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.thumbs img{width:100%;border-radius:8px;border:1px solid var(--line);display:block}
.thumbs figcaption{font-size:10px;color:var(--dim);text-align:center;margin-top:2px}
.goldcard{border:1px solid #ffd16655;background:linear-gradient(180deg,#2a2208,#1a1408);border-radius:16px;padding:12px;margin:8px 0}
.goldcard h3{color:var(--yel);font-size:15px;margin-bottom:4px}
.shake{animation:shake .32s linear}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.opt .hint{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2ee59d;margin-left:6px;vertical-align:middle}
.cardset{background:#14102a;border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.slabel{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:14px;margin:10px 0 4px}
.slabel span{color:var(--cyan);font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;margin:8px 0}
.seg button{flex:1;border:1px solid var(--line);background:#1a1633;border-radius:12px;padding:10px;font-weight:800;min-height:44px}
.seg button.on{border-color:var(--cyan);color:var(--cyan);background:#123}
input[type=range]{width:100%;height:32px;accent-color:#00e6c3}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.pcard{border:1px solid var(--line);background:#14102a;border-radius:12px;padding:0;overflow:hidden;text-align:left}
.pcard img{width:100%;display:block;aspect-ratio:1400/740;object-fit:cover;background:#000;min-height:64px}
.pcard figcaption{font-size:11px;padding:6px;font-weight:800;color:var(--text)}
.pcard figcaption small{display:block;color:var(--dim);font-weight:600}
.packrow{margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:14px;background:#14102a}
.packrow .lab{font-weight:900;color:var(--yel);margin-bottom:6px;font-size:14px}
.hide{display:none}
.pulse.exam{background:linear-gradient(135deg,var(--pur),#c44dff);color:#fff;box-shadow:0 8px 24px #8b6cff66;font-size:18px}
.sheet{border:1px dashed #ffd16688;background:#2a2208;border-radius:14px;padding:10px 12px;margin:0 0 8px;font-weight:800}
.sheet b{color:var(--yel)}
.sheet span{display:block;font-size:12px;color:var(--dim);font-weight:600;margin-top:2px}
.grow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--line);
  background:#14102a;border-radius:14px;padding:10px;margin:0 0 7px;min-height:56px}
.grow .lab{flex:1;font-weight:800;font-size:13.5px;line-height:1.3}
.grow .gbtn{width:46px;height:44px;border-radius:12px;border:1px solid var(--line);background:#ffffff10;font-weight:900;font-size:18px;flex-shrink:0}
.grow .gbtn.on.yes{background:#0d3a22;border-color:var(--ok);color:var(--ok)}
.grow .gbtn.on.no{background:#3a0d1c;border-color:var(--bad);color:#ffb3c5}
.hist{margin:10px 0;font-size:13px}
.hist div{padding:7px 0;border-bottom:1px solid var(--line);color:var(--dim)}
.step{display:flex;align-items:center;gap:8px;margin:8px 0}
.step button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#1a1633;font-weight:900;font-size:22px;flex-shrink:0}
.step input[type=range]{flex:1}
.chrono{color:var(--cyan);font-variant-numeric:tabular-nums;font-weight:800}
.hud .down{color:var(--yel);font-variant-numeric:tabular-nums}
.progline{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin:10px 0 4px}
.progline i{min-width:32px;padding:4px 0;border-radius:99px;background:#ffffff18;color:#9b97b8;font-size:10px;font-weight:800;font-style:normal;text-align:center}
.progline i.on{background:#00e6c333;color:var(--cyan)}
.progline i.now{background:var(--yel);color:#1a0a16}
.record{font-weight:800;color:var(--yel);margin:6px 0}
.row > .chip.wide{flex:1 0 100%;text-align:center}
.kindrow{display:grid;gap:8px;margin:10px 0}
.kind{text-align:left;border:1px solid var(--line);background:#1a1633;border-radius:14px;padding:10px 12px;min-height:56px}
.kind b{display:block;font-size:14px;font-weight:800}
.kind span{display:block;font-size:12px;color:var(--dim);font-weight:600;margin-top:3px;line-height:1.35}
.kind.on{border-color:var(--cyan);color:var(--cyan);background:#123}
.kind.on span{color:#9beee0}
.setrow{margin:0 0 10px}
@media (min-width:700px){ .kindrow{grid-template-columns:1fr 1fr 1fr} }
.dualimg{display:grid;gap:8px;margin-bottom:8px}



/* ---- desktop play layout (phone unchanged below 768px) ---- */
.imgnest{position:relative;display:block;width:100%}
.imgw .zoombtn{position:absolute;right:8px;top:8px;z-index:4;width:36px;height:36px;border-radius:10px;
  border:1px solid #ffffff33;background:#07060fcc;color:#fff;font-size:18px;cursor:zoom-in;display:none}
.desk-hint{display:none;font-size:11px;color:#6f6a8d;text-align:center;margin-top:auto;padding-top:8px;line-height:1.35}
.img-tabs{display:none;gap:6px;margin:0 0 8px}
.img-tabs button{flex:1;border:1px solid var(--line);background:#1a1633;border-radius:10px;padding:8px;font-weight:800;min-height:40px}
.img-tabs button.on{border-color:var(--cyan);color:var(--cyan);background:#123}
#lightbox{position:fixed;inset:0;z-index:80;background:#000e;display:none;touch-action:none}
#lightbox.on{display:block}
#lightbox .lb-stage{position:absolute;inset:0;overflow:hidden;cursor:grab}
#lightbox .lb-stage.drag{cursor:grabbing}
#lightbox .imgnest{position:absolute;left:50%;top:50%;width:max-content;max-width:96vw;
  transform:translate(-50%,-50%) scale(var(--z,1)) translate(var(--x,0px),var(--y,0px));
  transform-origin:center center}
#lightbox .imgnest img{display:block;width:auto;height:auto;max-width:96vw;max-height:96vh;object-fit:contain;user-select:none;-webkit-user-drag:none}
#lightbox .mark{pointer-events:none}
#lightbox .lb-ui{position:absolute;right:12px;top:12px;display:flex;gap:8px;z-index:2}
#lightbox .lb-ui button{width:44px;height:44px;border-radius:12px;border:1px solid #ffffff33;background:#07060fcc;color:#fff;font-size:20px;font-weight:800}
#lightbox .lb-help{position:absolute;left:12px;bottom:12px;color:#ffffffaa;font-size:12px;font-weight:700}
.grow.focus{outline:2px solid var(--cyan);outline-offset:1px}
@media (min-width:768px){
  #app.wide{max-width:1100px;width:100%}
  body.playon{padding:8px 12px;overflow:hidden;height:100dvh}
  body.playon #app.wide{height:100%}
  .playwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px);grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"img head" "img side";gap:10px 16px;height:calc(100dvh - 16px);min-height:0;align-items:stretch}
  .playwrap>.stick{display:contents;position:static;margin:0;padding:0;box-shadow:none;background:transparent;top:auto}
  .stage-head{grid-area:head;min-width:0;background:linear-gradient(180deg,#14102acc,#0c0a18cc);border:1px solid var(--line);
    border-radius:16px 16px 0 0;padding:10px 12px 8px;border-bottom:none}
  .stage-img{grid-area:img;container-type:size;min-width:0;min-height:0;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center}
  .stage-side{grid-area:side;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#0c0a18cc,#0c0a18cc);border:1px solid var(--line);border-top:none;
    border-radius:0 0 16px 16px;padding:8px 12px 10px}
  .stage-side #playbody{flex:1 1 auto;min-height:0;overflow:auto}
  .stage-head .hud{margin-bottom:8px}
  .stage-img .dualimg{flex:1;min-height:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column}
  .stage-img>.imgw,.stage-img .dualimg .imgw{flex:0 0 auto;width:auto;max-width:100%;max-height:100%;
    height:auto;min-height:0;min-width:0;margin:0;cursor:zoom-in}
  .stage-img .imgw .imgnest{position:relative;width:auto;height:auto;max-width:none;container-type:inline-size}
  .stage-img .imgw img.placa{width:auto;height:auto;min-height:0;object-fit:fill;display:block}
  .stage-img .imgw .zoombtn{display:grid;place-items:center}
  .imgw .mark{width:clamp(16px, 3.2cqi, 32px);height:auto;aspect-ratio:1;min-height:16px;max-height:32px;
    font-size:clamp(9px, 1.6cqi, 15px);border-width:2px}
  .desk-hint{display:block}
  .img-tabs{display:flex;width:100%;flex:0 0 auto}
  .playwrap.grade .stage-img{justify-content:flex-start}
  .playwrap.grade .dualimg .imgw{display:none;max-height:100%}
  .playwrap.grade .dualimg .imgw.on{display:block}
  .opts .opt{position:relative;padding-left:36px}
  .opts .opt:nth-child(1)::before,.opts .opt:nth-child(2)::before,.opts .opt:nth-child(3)::before,.opts .opt:nth-child(4)::before,
  .packrow .chips .tchip:nth-child(1)::before,.packrow .chips .tchip:nth-child(2)::before,.packrow .chips .tchip:nth-child(3)::before,.packrow .chips .tchip:nth-child(4)::before,
  #opts.chips .tchip:nth-child(1)::before,#opts.chips .tchip:nth-child(2)::before,#opts.chips .tchip:nth-child(3)::before,#opts.chips .tchip:nth-child(4)::before{
    position:absolute;left:10px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:5px;
    border:1px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--dim);background:#0004}
  .opts .opt:nth-child(1)::before,.packrow .chips .tchip:nth-child(1)::before,#opts.chips .tchip:nth-child(1)::before{content:"1"}
  .opts .opt:nth-child(2)::before,.packrow .chips .tchip:nth-child(2)::before,#opts.chips .tchip:nth-child(2)::before{content:"2"}
  .opts .opt:nth-child(3)::before,.packrow .chips .tchip:nth-child(3)::before,#opts.chips .tchip:nth-child(3)::before{content:"3"}
  .opts .opt:nth-child(4)::before,.packrow .chips .tchip:nth-child(4)::before,#opts.chips .tchip:nth-child(4)::before{content:"4"}
  .packrow .tchip,#opts.chips .tchip{position:relative;padding-left:32px}
  .stage-side .go.pinned{flex:0 0 auto;margin-bottom:0;margin-top:8px}
  .stage-side .desk-hint{flex:0 0 auto}
  @media (max-height:640px){ .desk-hint{display:none} }
}
@media (min-width:1100px){
  #app.wide{max-width:1400px}
  .playwrap{grid-template-columns:minmax(0,1fr) minmax(340px,420px);gap:12px 20px;height:calc(100dvh - 16px)}
}
@media (min-width:1100px) and (min-height:900px){
  .playwrap.grade .img-tabs{display:none}
  .playwrap.grade .dualimg{flex:1;display:grid !important;grid-template-columns:1fr;grid-template-rows:1fr 1fr;gap:10px;min-height:0;width:100%;height:100%}
  .playwrap.grade .dualimg .imgw{display:flex !important;max-height:100%;height:100%;max-width:100%;align-items:center;justify-content:center}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="data/primer-parcial.js"></script>
<script>
(function(){
let P = window.FB_PLACAS || [];
let META = window.FB_META || {};
let STRUCTS = window.FB_STRUCTS || [];
let COVER = window.FB_COVER || {};
const $ = id => document.getElementById(id);
const app = $("app");
const LS = "fb_morfo_v2";
const PASS = (META.passScore||80);
const LNAMES = {1:"Rápido",2:"Por partes",3:"Estructuras",4:"Jefe"};
const LBLURB = {
  1:"Diagnóstico completo. Opciones casi iguales (horas, somitas, corte).",
  2:"Arma el diagnóstico por trozos: tipo, etapa, corte o región.",
  3:"El núcleo: flechas 1, 2 o 4 a la vez, zona, y la que NO está.",
  4:"Mix de todo, timer más duro, 3 vidas y combo."
};
const TIME_DEF = {1:13,2:16,3:16,4:20};

function lsKey(){ return currentSetId==="primer-parcial" ? LS : LS+"__"+currentSetId; }
const load = () => {
  try {
    const raw=JSON.parse(localStorage.getItem(lsKey())||"{}");
    const s=Object.assign({}, DEFAULTS, raw);
    s.timeL=Object.assign({}, TIME_DEF, raw.timeL||{});
    if(!["level","custom","off"].includes(s.timeMode)) s.timeMode="level";
    if(s.advance!=="auto") s.advance="manual";
    s.pack=[1,2,4].includes(+s.pack)?+s.pack:1;
    s.timeSec=Math.max(10,Math.min(60,+s.timeSec||16));
    s.autoMs=Math.max(600,Math.min(8000,+s.autoMs||2000));
    if(!raw.examNV2 && (raw.examN==null || raw.examN===10)) s.examN=4;
    if(s.examN==="all") s.examN="all";
    else s.examN=Math.max(1, Math.min(Math.max(1,P.length), +s.examN||4));
    s.examCls=classValid(s.examCls)?String(s.examCls):"all";
    s.examKind=["dx","st","full"].includes(s.examKind)?s.examKind:"full";
    const kinds={};
    for(const id of Object.keys(EXAM_KINDS)){
      kinds[id]=Object.assign(emptyKindState(id), (raw.examKinds&&raw.examKinds[id])||{});
      kinds[id].hist=Array.isArray(kinds[id].hist)?kinds[id].hist.slice(0,20):[];
      const lad=examKindDef(id).ladder;
      kinds[id].limit=lad.includes(+kinds[id].limit)?+kinds[id].limit:examKindDef(id).defaultLimit;
      kinds[id].sec=Math.max(15,Math.min(180,+kinds[id].sec||examKindDef(id).defaultSec));
      kinds[id].prog=kinds[id].prog!==false;
    }
    // migrate previous completo records (one-time)
    if(!raw.examKinds && Array.isArray(raw.examHist) && raw.examHist.length){
      kinds.full.hist=raw.examHist.slice(0,20);
      if(raw.examBestAvg!=null) kinds.full.bestAvg=raw.examBestAvg;
      if(raw.examBestPlaca!=null) kinds.full.bestPlaca=raw.examBestPlaca;
      const lad=EXAM_KINDS.full.ladder;
      if(lad.includes(+raw.examLimit)) kinds.full.limit=+raw.examLimit;
      else if(+raw.examLimit>60) kinds.full.limit=60;
      kinds.full.sec=Math.max(15,Math.min(180,+raw.examSec||60));
      kinds.full.prog=raw.examProg!==false;
    }
    s.examKinds=kinds;
    const st=kinds[s.examKind];
    s.examSec=st.sec; s.examProg=st.prog; s.examLimit=st.limit;
    s.examHist=st.hist; s.examBestAvg=st.bestAvg; s.examBestPlaca=st.bestPlaca;
    s.examNV2=true;
    return s;
  } catch(e){ return Object.assign({}, DEFAULTS, {timeL:Object.assign({},TIME_DEF), examKinds:{dx:emptyKindState("dx"),st:emptyKindState("st"),full:emptyKindState("full")}}); }
};

function classIds(){
  const ids=META.classes?Object.keys(META.classes):[];
  if(ids.length) return ids;
  return [...new Set(P.map(p=>String(p.cls)))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
}
function classValid(c){ return c==="all" || classIds().includes(String(c)); }
function classShort(c){
  const m=META.classes&&META.classes[c];
  if(m&&m.short) return m.short;
  const fallback={2:"Gastro",3:"Tubo",4:"Cresta",5:"SNA",6:"Prosencéfalo"};
  if(fallback[c]) return fallback[c];
  if(m&&m.name){
    const n=String(m.name).replace(/^Clase\s+\S+\s*[—–-]\s*/,"").trim();
    return (n.split(/\s+/)[0]||("C"+c)).slice(0,16);
  }
  return "C"+c;
}
function classChips(sel, mode){

    return `<button class="chip ${sel===c?"on":""}" data-cls="${c}">${lab}</button>`;

}
function normalizePlaca(p){
  if(!p||typeof p!=="object") return p;
  p.cls=String(p.cls||p.class||"");
  p.diagnosis=p.diagnosis||p.diagnosis_exact||p.diagnosisExact||"";
  p.imgSin=p.imgSin||p.img_sin||p.imgSilenciada||p.img_silenciada||"";
  p.imgCon=p.imgCon||p.img_con||p.imgConNombres||p.img_con_nombres||"";
  if((!p.elements||!p.elements.length) && Array.isArray(p.structures)){
    p.elements=p.structures.map(s=>{
      const id=String(s.n??s.id??"");
      const name=s.label||s.name||"";
      let poly=s.poly;
      if((!poly||poly.length<4) && s.x!=null && s.y!=null){
        const x=+s.x, y=+s.y, w=+(s.w||6), h=+(s.h||5);
        poly=[[x-w/2,y-h/2],[x+w/2,y-h/2],[x+w/2,y+h/2],[x-w/2,y+h/2]];
      }
      return {id, name, poly, key:s.key||canon(name)};
    });
  }
  if(!Array.isArray(p.parts)) p.parts=p.parts||[];
  return p;
}

function switchSet(id){

  if(!spec) return;
  const go=()=>{

    S=load();

  };
  cacheSet(currentSetId);
  if(applyCachedSet(id)){ go(); return; }
  const sc=document.createElement("script");
  sc.src=spec.src+(spec.src.indexOf("?")>=0?"&":"?")+"t="+Date.now();
  sc.onload=()=>{ cacheSet(id); bindDataset(); spec.loaded=true; go(); };
  sc.onerror=()=>alert("No pude cargar el set "+spec.name+".");
  document.head.appendChild(sc);
}
async function discoverExtraSets(){
  const extras=[{id:"segundo-parcial", name:"Segundo parcial", src:"data/segundo-parcial.js"}];
  let added=false;
  for(const s of extras){
    if(AVAILABLE_SETS.some(x=>x.id===s.id)) continue;
    try{
      const r=await fetch(s.src,{cache:"no-store"});
      if(!r.ok) continue;
      const t=await r.text();
      if(!/window\.FB_(PLACAS|SET)\s*=/.test(t)) continue;
      AVAILABLE_SETS.push(Object.assign({loaded:false}, s));
      added=true;
    }catch(e){}
  }
  if(added && $("screen-menu")) menu();
}

function beep(type){
  if (S.mute) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx.state==="suspended") audioCtx.resume();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    const now=audioCtx.currentTime;
    if(type==="ok"){ o.type="square"; o.frequency.setValueAtTime(620,now); o.frequency.exponentialRampToValueAtTime(880,now+.08);
      g.gain.setValueAtTime(.07,now); g.gain.exponentialRampToValueAtTime(.001,now+.14); o.start(now); o.stop(now+.15); }
    else if(type==="bad"){ o.type="sawtooth"; o.frequency.setValueAtTime(180,now); o.frequency.exponentialRampToValueAtTime(70,now+.2);
      g.gain.setValueAtTime(.08,now); g.gain.exponentialRampToValueAtTime(.001,now+.22); o.start(now); o.stop(now+.23); }
    else { o.type="square"; o.frequency.setValueAtTime(type==="combo"?880:330,now);
      g.gain.setValueAtTime(.07,now); g.gain.exponentialRampToValueAtTime(.001,now+.16); o.start(now); o.stop(now+.17); }
  }catch(e){}
}
function vibe(ms){ try{ if(!S.mute && navigator.vibrate) navigator.vibrate(ms);}catch(e){} }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function uniq(a){ return [...new Set(a)]; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

function pool(cls){ return (!cls||cls==="all") ? P.slice() : P.filter(p=>p.cls===String(cls)); }
function prog(cls){ return S.progress[cls] || (S.progress[cls]={}); }
function passed(cls,lv){ return !!(prog(cls)[lv] && prog(cls)[lv].passed); }
function unlocked(cls,lv){ return S.free || lv===1 || passed(cls,lv-1); }
function nextLevel(cls){ for(const lv of [1,2,3,4]) if(!passed(cls,lv)) return lv; return 4; }
function centroid(poly){ let x=0,y=0; for(const pt of poly){x+=pt[0];y+=pt[1];} return [x/poly.length,y/poly.length]; }
function keysOf(p){ return new Set(p.elements.map(e=>canon(e.name))); }
function namesOf(p){ return uniqueByKey(p.elements.map(e=>e.name)); }
function norm(s){
  return String(s||"").toLowerCase().normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/([a-zñ])[-–—](?=\d)/gi,"$1")
    .replace(/[^\p{L}\p{N}]+/gu," ")
    .replace(/\s+/g," ")
    .trim();
}
const ALIAS = (() => {
  const m=Object.create(null);
  const set=(a,b)=>{ const A=norm(a); if(A) m[A]=norm(b); };
  for(const p of P) for(const e of p.elements){
    const ck=norm(e.key||e.name);
    set(e.name, ck);
    if(e.key) set(e.key, ck);
  }
  const extras=[
    ["espacio subacnoideo","espacio subaracnoideo"],
    ["Ganglio trigeminal (NC V)","ganglio trigémino (NC V)"],
    ["Orbitosfenoide","orbitoesfenoides"],
    ["Eminencia mandibular del arco faríngeo 1","Prominencia mandibular del arco faríngeo 1"],
    ["Eminencia maxilar del arco faríngeo 1","prominencia maxilar del arco faríngeo 1"]
  ];
  for(const [a,b] of extras){
    const C=m[norm(b)]||norm(b);
    set(a,C); set(b,C);
  }
  return m;
})();
function canon(s){ const k=norm(s); return ALIAS[k]||k; }
function sameAns(a,b){ return canon(a)===canon(b); }
function sameSet(A,B){
  const a=new Set((A||[]).map(canon)), b=new Set((B||[]).map(canon));
  if(a.size!==b.size) return false;
  for(const x of a) if(!b.has(x)) return false;
  return true;
}
function scrollTop(){ try{ window.scrollTo(0,0); document.documentElement.scrollTop=0; document.body.scrollTop=0; }catch(e){} }

function uniqueByKey(names){
  const seen=new Set(), out=[];
  for(const n of names){ const k=canon(n); if(!k||seen.has(k)) continue; seen.add(k); out.push(n); }
  return out;
}
function pickOptions(correct, pool, k){
  const rest=uniqueByKey((pool||[]).filter(v=>!sameAns(v,correct)));
  const distractors=shuffle(rest).slice(0,k);
  return shuffle(uniqueByKey([correct, ...distractors]));
}

function nearDx(correct, list, k){
  const others = uniqueByKey(list.map(p=>p.diagnosis)).filter(d=>!sameAns(d,correct));
  const extra = uniqueByKey(P.map(p=>p.diagnosis)).filter(d=>!sameAns(d,correct) && !others.some(o=>sameAns(o,d)));
  const score = d => {
    const A=new Set(norm(correct).split(/\s+/)), B=norm(d).split(/\s+/);
    let c=0; for(const w of B) if(A.has(w)) c++;
    return c + (list.some(p=>sameAns(p.diagnosis,d))?3:0);
  };
  others.sort((a,b)=>score(b)-score(a));
  const out=[];
  for(const d of others.concat(shuffle(extra))){
    if(out.length>=k) break;
    if(!sameAns(d,correct) && !out.some(o=>sameAns(o,d))) out.push(d);
  }
  return out;
}
function partBank(key){
  const vals=[];
  for(const p of P) for(const part of (p.parts||[])) if(part.key===key) vals.push(part.value);
  return uniqueByKey(vals);
}
function offNames(p, k){
  const have=keysOf(p);
  const out=[];
  for(const q of shuffle(P)){
    if(q.code===p.code) continue;
    for(const n of namesOf(q)){
      const key=canon(n);
      if(!have.has(key) && !out.some(o=>sameAns(o,n))) out.push(n);
      if(out.length>=k) return out;
    }
  }
  return out;
}
function similarOff(p, target, k){
  const bag=offNames(p, 80);
  const pref=bag.filter(n=>{
    const a=canon(target).split(" ")[0], b=canon(n).split(" ")[0];
    return a===b || /ganglio|nervio|ventriculo|placa|arteria|vena|talamo|hipotalamo/.test(canon(n));
  });
  return uniqueByKey(pref.concat(bag)).filter(n=>!sameAns(n,target)).slice(0,k);
}

function coreKeys(cls){
  const codes=new Set(pool(cls).map(p=>p.code));
  return STRUCTS.filter(s=>s.color==="green" && s.placas.some(c=>codes.has(c))).map(s=>s.key);
}
function cheatOn(cls){
  if (prog(cls).cheat) return true;
  const cores=coreKeys(cls);
  if(!cores.length) return false;
  let hit=0;
  for(const k of cores){ if((S.sm[k]||{}).ok>0) hit++; }
  if(hit/cores.length>=0.7){ prog(cls).cheat=true; save(); return true; }
  return false;
}

/* ---------- examen simulado ---------- */
function examLimit(){ const d=examKindDef(S.examKind); return Math.max(15, Math.min(180, +S.examSec||d.defaultSec)); }
function examProgressOn(){ return S.examProg!==false; }
function examLadder(){ return examKindDef(S.examKind).ladder; }
function examTarget(){
  const d=examKindDef(S.examKind);
  if(!examProgressOn()) return examLimit();
  return examLadder().includes(+S.examLimit)?+S.examLimit:d.defaultLimit;
}
function nextExamLimit(cur, passed){
  if(!passed) return cur;
  const lad=examLadder();
  const i=lad.indexOf(cur);
  if(i<0) return lad[0];
  return lad[Math.min(lad.length-1, i+1)];
}
function fmtClock(sec){
  sec=Math.max(0,Math.round(sec||0));
  const m=Math.floor(sec/60), s=sec%60;
  return m+":"+String(s).padStart(2,"0");
}
function pickExamPlacas(bag, n){
  n=Math.max(1, Math.min(n, bag.length));
  const byCls={};
  for(const p of bag) (byCls[p.cls]=byCls[p.cls]||[]).push(p);
  const classes=Object.keys(byCls);
  for(const c of classes) byCls[c]=shuffle(byCls[c]);
  const usedDx=new Set(), used=new Set(), out=[];
  const can=p=>!used.has(p.code) && !usedDx.has(canon(p.diagnosis));
  const take=p=>{ out.push(p); used.add(p.code); usedDx.add(canon(p.diagnosis)); };
  const rotate=shuffle(classes.slice());
  let guard=0;
  while(out.length<n && guard++<800){
    let added=false;
    const order=rotate.slice().sort((a,b)=>out.filter(p=>p.cls===a).length-out.filter(p=>p.cls===b).length);
    for(const c of order){
      if(out.length>=n) break;
      const have=out.filter(p=>p.cls===c).length;
      if(n<=5 && have>=1 && new Set(out.map(p=>p.cls)).size<Math.min(n, classes.length)) continue;
      const cand=byCls[c].find(can);
      if(cand){ take(cand); added=true; }
    }
    if(!added) break;
  }
  if(out.length<n){
    for(const p of shuffle(bag.slice())){ if(out.length>=n) break; if(can(p)) take(p); }
  }
  if(out.length<n){
    for(const p of shuffle(bag.slice())){ if(out.length>=n) break; if(!used.has(p.code)) take(p); }
  }
  return out.slice(0,n);
}
function pickSpread(p, n){
  const els=uniqueByKeyEls((p.elements||[]).filter(e=>e.poly&&e.poly.length>=4));
  if(els.length<n) return null;
  const withC=els.map(e=>({e,c:centroid(e.poly)}));
  const start=withC[Math.floor(Math.random()*withC.length)];
  const out=[start], left=withC.filter(x=>x!==start);
  while(out.length<n && left.length){
    let best=0, bestD=-1;
    for(let i=0;i<left.length;i++){
      const d=Math.min(...out.map(o=>{
        const dx=o.c[0]-left[i].c[0], dy=o.c[1]-left[i].c[1];
        return dx*dx+dy*dy;
      }));
      if(d>bestD){ bestD=d; best=i; }
    }
    out.push(left.splice(best,1)[0]);
  }
  return shuffle(out).map((x,i)=>({id:String(i+1), name:x.e.name, poly:x.e.poly, origId:x.e.id, key:x.e.key||canon(x.e.name)}));
}

function startExam(opts){
  const kindId=opts.kind||S.examKind||"full";
  const kind=examKindDef(kindId);
  const cls=opts.cls||S.examCls||"all";
  const bag=(opts.list||pool(cls)).filter(p=>{
    if(kind.arrows){ const t=pickSpread(p,kind.arrows); return t&&t.length===kind.arrows; }
    return !!(p&&p.diagnosis);
  });
  let n=opts.n==="all"?bag.length:Math.min(+opts.n||4, bag.length);
  if(opts.only) n=opts.only.length;
  const pick=opts.only? opts.only.map(code=>bag.find(p=>p.code===code)||P.find(p=>p.code===code)).filter(Boolean) : pickExamPlacas(bag, n);
  const qs=pick.map(p=>{
    const targets=kind.arrows? pickSpread(p, kind.arrows) : [];
    return {kind:"exam", examKind:kindId, placa:p, targets:targets||[], prompt:"Escribe en tu hoja "+kind.countdown+".", marks:null};
  }).filter(q=>!kind.arrows || (q.targets&&q.targets.length===kind.arrows));
  if(!qs.length){ alert(kind.arrows?"No hay placas con "+kind.arrows+" estructuras bien ubicadas.":"No hay placas con diagnóstico para este set."); return; }
  G={mode:"exam", examKind:kindId, cls, qs, i:0, t0:Date.now(), log:[], limit:examTarget(), prog:examProgressOn(), repeat:!!opts.only, ptsPer:kind.ptsPer, gradeDx:kind.gradeDx, gradeSt:kind.gradeSt, arrows:kind.arrows};
  beep("go");
  if(opts.skipCount) showExamQ();
  else examCountdown();
}

function examCountdown(){
  const gen=++countGen;
  let n=3;
  const tick=()=>{
    if(gen!==countGen) return;
    const kind=examKindDef(G.examKind);
    app.innerHTML=`<div class="count" id="screen-count"><div class="k" style="color:var(--cyan);letter-spacing:.16em;font-weight:800;font-size:12px">EXAMEN · ${esc(kind.title).toUpperCase()} · ${G.cls==="all"?"TODO EL PARCIAL":"CLASE "+G.cls}</div><b>${n}</b><p style="color:var(--dim)">${G.qs.length} placas · ${G.limit} s c/u · ${kind.countdown}. Suéltalo.</p></div>`;
    beep("go"); vibe(18);
    if(n>1){ n--; setTimeout(tick,500); }
    else setTimeout(()=>{ if(gen!==countGen) return; beep("combo");showExamQ();},500);
  };
  tick();
}

let fitObs=null;
function stopFitObs(){ if(fitObs){ fitObs.disconnect(); fitObs=null; } }
function clearFit(el){
  if(!el) return;
  el.style.width=""; el.style.height=""; el.style.maxWidth=""; el.style.maxHeight="";
}
function fitPlacas(){
  const desk=window.matchMedia("(min-width:768px)").matches;
  document.querySelectorAll(".stage-img img.placa").forEach(img=>{
    const nest=img.closest(".imgnest");
    const box=img.closest(".imgw");
    if(!desk){ clearFit(img); clearFit(nest); clearFit(box); return; }
    const stage=img.closest(".stage-img");
    if(!stage) return;
    const dual=img.closest(".dualimg");
    const dualGrid=dual && getComputedStyle(dual).display==="grid";
    let availW=stage.clientWidth, availH=stage.clientHeight;
    if(dualGrid){
      const cs=getComputedStyle(dual);
      const cols=cs.gridTemplateColumns.split(" ").filter(s=>s && s!=="none");
      const rows=cs.gridTemplateRows.split(" ").filter(s=>s && s!=="none");
      const gap=parseFloat(cs.gap)||10;
      if(cols.length>=2){
        availW=Math.max(80, Math.floor((dual.clientWidth-gap*(cols.length-1))/cols.length));
        availH=Math.max(80, dual.clientHeight);
      } else {
        const n=Math.max(2, rows.length||2);
        availW=Math.max(80, dual.clientWidth);
        availH=Math.max(80, Math.floor((dual.clientHeight-gap*(n-1))/n));
      }
    }
    availW=Math.max(80, availW);
    availH=Math.max(80, availH);
    const nw=img.naturalWidth||0, nh=img.naturalHeight||0;
    if(!nw||!nh){
      img.style.maxWidth=availW+"px";
      img.style.maxHeight=availH+"px";
      return;
    }
    const scale=Math.min(availW/nw, availH/nh);
    const w=Math.max(1, Math.round(nw*scale));
    const h=Math.max(1, Math.round(nh*scale));
    img.style.maxWidth="none";
    img.style.maxHeight="none";
    img.style.width=w+"px";
    img.style.height=h+"px";
    if(nest){ nest.style.width=w+"px"; nest.style.height=h+"px"; nest.style.maxWidth="none"; }
    if(box){ box.style.width=w+"px"; box.style.height=h+"px"; box.style.maxWidth="none"; box.style.maxHeight="none"; }
  });
}
function startFitObs(){
  stopFitObs();
  const el=$("playwrap")||document.querySelector(".stage-img");
  if(!el || !window.ResizeObserver){ fitPlacas(); return; }
  fitObs=new ResizeObserver(()=>fitPlacas());
  fitObs.observe(el);
  const st=el.querySelector(".stage-img");
  if(st) fitObs.observe(st);
  el.querySelectorAll("img.placa").forEach(img=>{
    if(!img.dataset.fitBound){ img.dataset.fitBound="1"; img.addEventListener("load", fitPlacas); }
  });
  fitPlacas();
}

let lbState=null;
function openLightbox(fromBox){
  const srcBox=fromBox||document.querySelector(".imgw.on")||$("iw")||document.querySelector(".imgw");
  if(!srcBox) return;
  let lb=$("lightbox");
  if(!lb){
    lb=document.createElement("div");
    lb.id="lightbox";
    lb.innerHTML=`<div class="lb-stage" id="lbstage"></div>
      <div class="lb-ui"><button type="button" id="lbclose" aria-label="Cerrar">✕</button></div>
      <div class="lb-help">Rueda o pellizco = zoom · arrastra = mover · F o Esc = cerrar</div>`;
    document.body.appendChild(lb);
    $("lbclose").onclick=e=>{ e.stopPropagation(); closeLightbox(); };
    lb.addEventListener("click", ev=>{ if(ev.target===lb) closeLightbox(); });
  }
  const stage=$("lbstage");
  const nest=srcBox.querySelector(".imgnest");
  stage.innerHTML="";
  const clone=(nest||srcBox).cloneNode(true);
  clone.querySelectorAll(".zoombtn,.img-err").forEach(n=>n.remove());
  if(!clone.classList.contains("imgnest")) clone.classList.add("imgnest");
  stage.appendChild(clone);
  lb.classList.add("on");
  const st={z:1,x:0,y:0,px:0,py:0,drag:false,pid:null,pinch:0};
  lbState=st;
  const apply=()=>{
    clone.style.setProperty("--z", st.z);
    clone.style.setProperty("--x", st.x+"px");
    clone.style.setProperty("--y", st.y+"px");
  };
  apply();
  const zoomAt=(factor)=>{
    st.z=Math.max(1, Math.min(8, st.z*factor));
    if(st.z===1){ st.x=0; st.y=0; }
    apply();
  };
  stage.onwheel=ev=>{ ev.preventDefault(); zoomAt(ev.deltaY<0?1.12:1/1.12); };
  stage.onpointerdown=ev=>{
    if(ev.pointerType==="touch" && ev.isPrimary===false) return;
    st.drag=true; st.pid=ev.pointerId; st.px=ev.clientX; st.py=ev.clientY;
    stage.classList.add("drag");
    try{ stage.setPointerCapture(ev.pointerId); }catch(e){}
  };
  stage.onpointermove=ev=>{
    if(!st.drag || ev.pointerId!==st.pid) return;
    st.x+=(ev.clientX-st.px)/st.z;
    st.y+=(ev.clientY-st.py)/st.z;
    st.px=ev.clientX; st.py=ev.clientY;
    apply();
  };
  const end=ev=>{
    if(ev && ev.pointerId!==st.pid) return;
    st.drag=false; st.pid=null; stage.classList.remove("drag");
  };
  stage.onpointerup=end; stage.onpointercancel=end;
  stage.ondblclick=ev=>{ ev.preventDefault(); if(st.z>1.05){ st.z=1; st.x=0; st.y=0; } else st.z=2.5; apply(); };
  // pinch
  const dist=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  stage.ontouchstart=ev=>{
    if(ev.touches.length===2){ st.pinch=dist(ev.touches[0], ev.touches[1]); }
  };
  stage.ontouchmove=ev=>{
    if(ev.touches.length===2 && st.pinch){
      ev.preventDefault();
      const d=dist(ev.touches[0], ev.touches[1]);
      zoomAt(d/st.pinch);
      st.pinch=d;
    }
  };
  stage.ontouchend=()=>{ st.pinch=0; };
}
function closeLightbox(){
  const lb=$("lightbox");
  if(lb) lb.classList.remove("on");
  lbState=null;
}
function isTypingTarget(el){
  if(!el) return false;
  const t=(el.tagName||"").toLowerCase();
  return t==="input"||t==="textarea"||t==="select"||el.isContentEditable;
}
function clickFirst(sels){
  for(const s of sels){
    const el=document.querySelector(s);
    if(el && el.offsetParent!==null){ el.click(); return true; }
  }
  return false;
}
function deskKey(ev){
  if(isTypingTarget(ev.target)) return;
  const lb=$("lightbox");
  const lbOn=lb && lb.classList.contains("on");
  const playing=document.body.classList.contains("playon");
  const k=ev.key;
  if(k==="Escape"){
    if(lbOn){ ev.preventDefault(); closeLightbox(); }
    return;
  }
  if((k==="f"||k==="F") && (playing||lbOn||document.querySelector(".imgw img.placa"))){
    ev.preventDefault();
    if(lbOn) closeLightbox();
    else openLightbox();
    return;
  }
  if(lbOn || !playing) return;
  if(k==="Enter" || k===" "){
    if(clickFirst(["#btn-next","#okz"])) ev.preventDefault();
    return;
  }
  const gradeRows=[...document.querySelectorAll("#grades .grow")];
  if(gradeRows.length){
    if(["y","Y","v","V","n","N","x","X","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(k) || /^[1-5]$/.test(k)){
      ev.preventDefault();
      let i=gradeRows.findIndex(r=>r.classList.contains("focus"));
      if(i<0) i=0;
      if(k==="ArrowUp"||k==="ArrowLeft") i=Math.max(0,i-1);
      else if(k==="ArrowDown"||k==="ArrowRight") i=Math.min(gradeRows.length-1,i+1);
      else if(/^[1-5]$/.test(k)) i=Math.min(gradeRows.length-1, +k-1);
      gradeRows.forEach((r,j)=>r.classList.toggle("focus", j===i));
      if(["y","Y","v","V","n","N","x","X"].includes(k)){
        const yes=/^[yYvV]$/.test(k);
        const btn=gradeRows[i].querySelector(yes?".gbtn.yes":".gbtn.no");
        if(btn) btn.click();
        if(i<gradeRows.length-1){ gradeRows[i].classList.remove("focus"); gradeRows[i+1].classList.add("focus"); }
      }
    }
    return;
  }
  if(/^[1-4]$/.test(k)){
    const n=+k-1;
    const packOn=document.querySelector(".packrow");
    if(packOn){
      const rows=[...document.querySelectorAll(".packrow")];
      let row=rows.find(r=>r.classList.contains("focus"))||rows.find(r=>!r.querySelector(".tchip.on"))||rows[0];
      rows.forEach(r=>r.classList.toggle("focus", r===row));
      const chips=[...row.querySelectorAll(".tchip")];
      if(chips[n]) chips[n].click();
      ev.preventDefault();
      return;
    }
    const opts=[...document.querySelectorAll("#opts .opt, #opts .tchip")];
    if(opts[n]){ ev.preventDefault(); opts[n].click(); }
  }
}
document.addEventListener("keydown", deskKey);

function runExamTimer(){
  const fill=$("tfill"), bar=$("tbar"), lab=$("etleft"), up=$("eup");
  if(!fill) return;
  const total=G.deadline-Date.now();
  const step=()=>{
    if(!G||G.mode!=="exam"||G.locked||G.phase!=="ask") return;
    const now=Date.now();
    const left=G.deadline-now;
    const elapsed=Math.max(0,(now-(G.placaT0||now))/1000);
    fill.style.transform=`scaleX(${Math.max(0,left/total)})`;
    if(lab) lab.textContent="⬇ "+Math.max(0,Math.ceil(left/1000))+"s";
    if(up) up.textContent="⏱ "+fmtClock(elapsed);
    if(left<5000 && bar) bar.classList.add("low");
    if(left<=0){ examReveal(true); return; }
    raf=requestAnimationFrame(step);
  };
  raf=requestAnimationFrame(step);
}

function examReveal(timeout){

  q.elapsed=elapsed;
  if(timeout){ beep("bad"); vibe([30,30,30]); } else { beep("ok"); vibe(12); }
  const kind=examKindDef(G.examKind);

    img: `<div class="img-tabs" id="itabs">

      </div>`,
    body: `<div id="grades">
      ${kind.gradeDx?`<div class="grow focus" data-k="dx"><div class="lab"><span style="color:var(--dim);font-size:11px">Diagnóstico</span><br>${esc(p.diagnosis)}</div>
        <button class="gbtn yes" data-v="1">✓</button><button class="gbtn no" data-v="0">✗</button></div>`:""}
      ${marks.map((t,i)=>`<div class="grow ${!kind.gradeDx&&i===0?"focus":""}" data-k="st" data-i="${i}"><div class="lab"><span style="color:var(--yel);font-weight:900">(${esc(t.id)})</span> ${esc(t.name)}</div>

    </div>

    <button class="go" id="btn-next">Siguiente</button>`
  });
  bindPlacaImg(q,false);
  wirePlacaClicks();
  const setBtn=(row,val)=>{
    row.querySelectorAll(".gbtn").forEach(b=>b.classList.toggle("on", +b.dataset.v===val));
  };
  document.querySelectorAll(".grow").forEach(row=>{
    row.querySelectorAll(".gbtn").forEach(b=>{
      b.onclick=()=>{
        const val=+b.dataset.v;
        setBtn(row,val);
        if(row.dataset.k==="dx") q.grade.dx=!!val;
        else q.grade.st[+row.dataset.i]=!!val;
        vibe(8);
      };
    });
  });
  $("btn-next").onclick=()=>{
    const dx=kind.gradeDx? !!q.grade.dx : true;
    const st=kind.gradeSt? (q.grade.st||[]).map(v=>!!v) : [];
    const pts=(kind.gradeDx?(dx?1:0):0)+st.filter(Boolean).length;
    const max=kind.ptsPer;
    G.log.push({code:p.code, cls:p.cls, dx:p.diagnosis, okDx:kind.gradeDx?dx:null, st:marks.map((t,i)=>({id:t.id,name:t.name,ok:!!st[i]})), pts, max, elapsed:q.elapsed||elapsed, examKind:kind.id});
    record(p, pts>=max, {kind:"exam-"+kind.id, answer:p.diagnosis});
    G.i++; showExamQ();
  };
}

function examResults(){
  stopTimer(); clearFB(); setPlayLayout(false);
  const t=Math.round((Date.now()-G.t0)/1000);
  const kind=examKindDef(G.examKind);
  const score=G.log.reduce((a,r)=>a+r.pts,0);
  const max=G.log.reduce((a,r)=>a+(r.max||kind.ptsPer),0);
  const failed=G.log.filter(r=>r.pts<(r.max||kind.ptsPer));
  const acc=max?Math.round(score*100/max):0;
  const times=G.log.map(r=>+r.elapsed||0).filter(x=>x>0);
  const avg=times.length? times.reduce((a,b)=>a+b,0)/times.length : 0;
  const best=times.length?Math.min(...times):0;
  const passed=max>0 && acc>=EXAM_PASS;
  const prevLimit=G.limit;
  let newLimit=prevLimit;
  if(G.prog){
    newLimit=nextExamLimit(prevLimit, passed);
    S.examLimit=newLimit;
  }
  const avgR=Math.round(avg*10)/10;
  if(avg>0 && (S.examBestAvg==null || avg<S.examBestAvg)) S.examBestAvg=avgR;
  if(best>0 && (S.examBestPlaca==null || best<S.examBestPlaca)) S.examBestPlaca=best;
  const rec={ts:Date.now(), cls:G.cls, n:G.log.length, score, max, sec:prevLimit, failed:failed.map(f=>({code:f.code,pts:f.pts,dx:f.dx})), duration:t, avg:avgR, best, passed, limitAfter:newLimit, times};
  S.examHist=[rec, ...(S.examHist||[])].slice(0,20);
  save();
  const title=acc===100?"LIMPIO":passed?"MUY SÓLIDO":acc>=50?"HAY QUE REPASAR":"OTRA RONDA";
  const recLine=S.examBestAvg!=null?`<div class="record">Récord: ${(+S.examBestAvg).toFixed(+S.examBestAvg%1?1:0)} s/placa${S.examBestPlaca!=null?" · más rápida "+S.examBestPlaca+" s":""}</div>`:"";
  const progNote=G.prog?(passed?(newLimit<prevLimit?`Pasaste (≥${EXAM_PASS}%). El tope baja: ${prevLimit}s → ${newLimit}s.`:`Reto máximo: te quedas en ${prevLimit} s.`):`No llegaste al ${EXAM_PASS}%. El tope se queda en ${prevLimit} s.`):`Tiempo fijo: ${prevLimit} s.`;
  const pips=G.prog?`<div class="progline">${examLadder().map(s=>`<i class="${s===newLimit?"now":s>=newLimit?"on":""}">${s}</i>`).join("")}</div>`:"";
  const recent=(S.examHist||[]).slice(0,6).map(h=>{
    const when=new Date(h.ts).toLocaleString("es-CO",{dateStyle:"short",timeStyle:"short"});
    return `<div>${esc(when)} · ${h.score}/${h.max}${h.avg!=null?" · "+h.avg+" s/placa":""} · tope ${h.sec}s${h.passed?" ✓":""}</div>`;
  }).join("");
  app.innerHTML=`
    <div class="results" id="screen-exam-results">
      <div class="k" style="color:var(--cyan);letter-spacing:.16em;font-weight:800;font-size:12px">EXAMEN · ${esc(kind.title).toUpperCase()}</div>
      <h2>${title}</h2>
      <div class="bigscore">${score}<span style="font-size:22px;color:var(--dim)">/${max}</span></div>
      <p>${G.log.length} placas · ${acc}% · esta ronda ${avgR||"—"} s/placa (mejor ${best||"—"} s) · tope ${prevLimit}s</p>
      ${recLine}
      <p class="lead">${progNote}</p>
      ${pips}
      <div class="miss"><b>${esc(kind.missTitle)}</b>
        ${G.log.map(r=>{
          const cap=r.max||kind.ptsPer;
          const dxPart=kind.gradeDx?(`Dx ${r.okDx?"✓":"✗"}`):(r.dx?esc(r.dx):"");
          const stPart=(r.st||[]).length? r.st.map(s=>(s.ok?"✓":"✗")+s.id).join(" ") : "";
          return `<div>${r.code}: <b style="color:${r.pts===cap?"var(--ok)":"var(--yel)"}">${r.pts}/${cap}</b> · ${r.elapsed?r.elapsed+" s":""}${kind.gradeDx?" · "+dxPart:""}${stPart?" · "+stPart:""}${kind.gradeDx||!r.dx?"":""}<br><span style="color:var(--dim)">${esc(r.dx||"")}</span></div>`;
        }).join("")}
      </div>
      ${recent?`<div class="hist"><b>Tus rondas</b>${recent}</div>`:""}
      ${failed.length?`<p class="lead">Falladas: ${failed.map(f=>f.code).join(" · ")}</p>
        <button class="go" id="rep">Repetir falladas</button>`:""}
      <button class="go ${failed.length?"alt":""}" id="again">Otro examen</button>
      <button class="go alt" id="home">Volver al menú</button>
    </div>`;
  if($("rep")) $("rep").onclick=()=>startExam({cls:G.cls, n:failed.length, only:failed.map(f=>f.code), kind:G.examKind});
  $("again").onclick=()=>showExamSetup();
  $("home").onclick=menu;
}

function startLearn(placas){
  const pack=S.pack||1;
  const rounds=placas.map(p=>{
    const els=shuffle(p.elements.filter(e=>e.poly&&e.poly.length>=4));
    return {placa:p, els, missed:[]};
  }).filter(r=>r.els.length);
  if(!rounds.length){ alert("Estas placas no tienen estructuras bien ubicadas."); return; }
  G={mode:"learn", cls:selCls, rounds, ri:0, qi:0, pack, ok:0, bad:0, t0:Date.now(), locked:false};
  beep("go"); showLearnQ();
}

function learnChunks(els, pack, qi){
  const n=Math.max(1, pack);
  return els.slice(qi, qi+n);
}

function showLearnQ(){
  stopTimer(); clearFB(); scrollTop();
  if(!G || G.mode!=="learn") return;
  if(G.ri>=G.rounds.length) return learnDone();
  const R=G.rounds[G.ri], p=R.placa;
  if(G.qi>=R.els.length){ return learnReveal(); }
  const chunk=learnChunks(R.els, G.pack, G.qi);
  const items=[];
  for(const el of chunk){
    const wrong=similarOff(p, el.name, 3);
    const opts=uniqueByKey([el.name, ...wrong]);
    if(opts.length<2) continue;
    items.push({target:el, options:shuffle(opts), answer:el.name, pick:null});
  }
  if(!items.length){ G.qi+=chunk.length||1; return showLearnQ(); }
  const q={kind:items.length===1?"st":"stpack", placa:p, target:items[0].target, targets:items.map(i=>i.target), items, prompt: items.length===1?`¿Cuál es esta estructura?  (${items[0].target.id||"•"})`: (items.length===2?"¿Cuáles son estas 2 estructuras?":`¿Cuáles son estas ${items.length} estructuras?`), sub: items.length>1?"Una respuesta por número":""};
  G.q=q; G.locked=false;
  const total=G.rounds.reduce((a,r)=>a+r.els.length,0);
  const done=G.rounds.slice(0,G.ri).reduce((a,r)=>a+r.els.length,0)+G.qi;
  setPlayLayout(true);
  app.innerHTML=playWrap({
    hud:`<div class="hud" id="screen-learn-q">
        <button class="ib" id="back" style="width:36px;height:36px">◀</button>
        <div>${p.code}</div>
        <div>${Math.min(total,done+chunk.length)}/${total}</div>
        <div class="sp">${G.ok}✓ ${G.bad?G.bad+"✗":""}</div>
      </div>`,
    prompt:`<div class="prompt">${esc(q.prompt)}</div>`,
    sub: q.sub?`<div class="sub">${esc(q.sub)}</div>`:"",
    img: placaHTML({id:"iw", tag:`Clase ${p.cls} · ${p.code}`, src:p.imgSin, alt:"Placa "+p.code, on:true})
  });
  $("back").onclick=()=>{ if(confirm("¿Salir de esta ronda?")) showLearnPick(); };
  bindPlacaImg(q, false);
  wirePlacaClicks();
  renderBody(q, true);
}

function learnCheck(okAll, detail){
  if(!G||G.locked) return;
  G.locked=true;
  const q=G.q, p=q.placa, R=G.rounds[G.ri];
  const items=q.items||[{target:q.target,answer:q.answer}];
  items.forEach((it,i)=>{
    const ok=detail?detail[i]:okAll;
    if(ok){ G.ok++; record(p,true,{kind:"st",answer:it.answer}); }
    else { G.bad++; R.missed.push(it.target); record(p,false,{kind:"st",answer:it.answer}); }
  });
  if(okAll){ beep("ok"); vibe(12); } else { beep("bad"); vibe([30,30,30]); }
  const fb=document.createElement("div");
  fb.className="fb "+(okAll?"good":"nope");
  fb.id="screen-fb";
  const lines=(q.items||[{target:q.target,answer:q.answer,pick:null}]).map(it=>{
    const good=it.pick==null? it.answer : it.pick;
    const right=it.pick==null || sameAns(it.pick,it.answer);
    return `<div class="els">${esc(it.target.id||"")} · ${right?"✓":"✗"} <b style="color:${right?"var(--ok)":"var(--bad)"}">${esc(it.answer)}</b>${!right && it.pick?` <span style="color:var(--dim)">(dijiste ${esc(it.pick)})</span>`:""}</div>`;
  }).join("");
  fb.innerHTML=`<h3>${okAll?"¡Exacto!":"Mira el correcto."}</h3>${lines}
    <button class="go" id="btn-next">Siguiente</button>`;
  $("playbody").appendChild(fb);
  bindPlacaImg(q, true);
  $("btn-next").onclick=()=>{
    G.qi += (q.items?q.items.length:1);
    showLearnQ();
  };
}

function uniqueByKeyEls(els){
  const seen=new Set(), out=[];
  for(const e of els){ const k=canon(e.name); if(!k||seen.has(k)) continue; seen.add(k); out.push(e); }
  return out;
}

function start(opts){
  stopTimer(); clearFB();
  const level=opts.level||1, cls=opts.cls||"all";
  if(!unlocked(cls,level)){ alert("Nivel bloqueado."); return; }
  const list=pool(cls);
  if(!list.length) return;
  const qs=buildQuestions(list, level, cls);
  if(!qs.length){ alert("No pude armar preguntas para este nivel con estas placas."); return; }
  G={mode:"play", level,cls,isBoss:level===4,qs,i:0,lives:level===4?3:null,combo:0,maxCombo:0,score:0,ok:0,bad:0,t0:Date.now(),log:[],baseTime:TIME_DEF[level]||16};
  countdown();
}

function buildQuestions(list, level, cls){
  const qs=[];
  const pack=S.pack||1;
  if(level===1){
    shuffle(list).forEach(p=>{ const q=makeDx(p,list); if(q) qs.push(q); });
    return qs;
  }
  if(level===2){
    const bag=shuffle(list);
    const cap = cls==="all"? 24 : 999;
    for(const p of bag){
      for(const part of (p.parts||[])){
        const q=makePart(p,part);
        if(q) qs.push(q);
        if(qs.length>=cap) return qs;
      }
    }
    return qs;
  }
  if(level===3){
    const bag=shuffle(list.filter(p=>p.structureOK));
    const kinds= pack>1 ? ["stpack","stpack","stpack","zone","absent"] : ["st","st","st","zone","absent"];
    const cap = Math.min(18, Math.max(10, bag.length*2));
    let i=0, guard=0;
    while(qs.length<cap && guard++<400 && bag.length){
      const p=bag[i%bag.length]; i++;
      const kind=kinds[qs.length%kinds.length];
      const q= kind==="stpack"? makeStPack(p,pack) : makeStruct(p, kind);
      if(q) qs.push(q);
    }
    return qs;
  }
  // jefe
  const n = cls==="all"?20:Math.max(12, Math.min(16, list.length*2));
  const bag=[];
  list.forEach(p=>{
    const m=S.mastery[p.code]||{ok:0,bad:0};
    const w=Math.max(1, Math.round(1+m.bad*3+(m.ok?0:1)));
    for(let i=0;i<w;i++) bag.push(p);
  });
  const kinds=["dx","part","stpack","zone","absent"];
  let guard=0;
  while(qs.length<n && guard++<500){
    const p=bag[Math.floor(Math.random()*bag.length)];
    let kind=kinds[qs.length%kinds.length];
    let q=null;
    if(kind==="dx") q=makeDx(p,list);
    else if(kind==="part"){ const parts=p.parts||[]; if(parts.length) q=makePart(p,parts[qs.length%parts.length]); }
    else if(kind==="stpack") q=makeStPack(p,pack);
    else q=makeStruct(p, kind);
    if(q) qs.push(q);
  }
  return qs;
}

function makeDx(p,list){
  const opts=pickOptions(p.diagnosis, nearDx(p.diagnosis,list,8), 3);
  if(opts.length<2) return null;
  if(opts.filter(o=>sameAns(o,p.diagnosis)).length!==1) return null;
  return {kind:"dx", placa:p, options:opts, answer:p.diagnosis, prompt:"¿Cuál es el diagnóstico exacto?"};
}
function makePart(p, part){
  const bank=partBank(part.key).filter(v=>!sameAns(v,part.value));
  if(bank.length<1) return null;
  const opts=pickOptions(part.value, bank, 3);
  if(opts.length<2 || opts.filter(o=>sameAns(o,part.value)).length!==1) return null;
  return {kind:"part", placa:p, part, options:opts, answer:part.value, prompt:part.prompt,
    sub: (p.parts||[]).map(x=>x.key===part.key? "…": x.value).join("  ·  ")};
}
function makeStruct(p, kind){
  if(!p.structureOK) return null;
  if(kind==="st"||kind==="stpack") return makeSt(p);
  if(kind==="zone") return makeZone(p);
  if(kind==="absent") return makeAbsent(p);
  return makeSt(p);
}
function makeSt(p){
  const els=uniqueByKeyEls(p.elements.filter(e=>e.poly && e.poly.length>=4));
  if(!els.length) return null;
  const el=els[Math.floor(Math.random()*els.length)];
  const wrong=similarOff(p, el.name, 8);
  const opts=pickOptions(el.name, wrong, 3);
  if(opts.length<3 || opts.filter(o=>sameAns(o,el.name)).length!==1) return null;
  const lab=el.id||"•";
  return {kind:"st", placa:p, target:el, targets:[el], items:[{target:el,options:opts,answer:el.name}], options:opts, answer:el.name,
    prompt:`¿Cuál es esta estructura?  (${lab})`};
}
function makeStPack(p, n){
  const els=uniqueByKeyEls(p.elements.filter(e=>e.poly && e.poly.length>=4));
  if(!els.length) return null;
  n=Math.min(Math.max(1,n||1), els.length);
  if(n===1) return makeSt(p);
  const targets=shuffle(els).slice(0,n);
  const items=[];
  for(const el of targets){
    const opts=pickOptions(el.name, similarOff(p, el.name, 8), 3);
    if(opts.length<3 || opts.filter(o=>sameAns(o,el.name)).length!==1) continue;
    items.push({target:el, options:opts, answer:el.name});
  }
  if(items.length<2) return items.length===1? makeSt(p): null;
  return {kind:"stpack", placa:p, targets:items.map(i=>i.target), items,
    prompt: items.length===2 ? "¿Cuáles son estas 2 estructuras?" : `¿Cuáles son estas ${items.length} estructuras?`,
    sub:"Una respuesta por número · luego Listo"};
}
function makeZone(p){
  const els=p.elements.filter(e=>e.poly&&e.poly.length>=4);
  if(els.length<4) return null;
  const cents=els.map(e=>({e,c:centroid(e.poly)}));
  const tries=[];
  const add=(inn, box)=>{
    if(inn.length>=2 && inn.length<=5 && inn.length<cents.length){
      const keys=new Set(inn.map(x=>x.e.key||norm(x.e.name)));
      const out=cents.filter(x=>!keys.has(x.e.key||norm(x.e.name)));
      if(out.length>=1) tries.push({inn,out,box});
    }
  };
  [[c=>c[0]<50],[c=>c[0]>=50],[c=>c[1]<50],[c=>c[1]>=50]].forEach(([fn])=>{
    const inn=cents.filter(x=>fn(x.c));
    if(!inn.length) return;
    const xs=inn.map(x=>x.c[0]), ys=inn.map(x=>x.c[1]);
    add(inn, {x0:Math.min(...xs)-4,y0:Math.min(...ys)-6,x1:Math.max(...xs)+4,y1:Math.max(...ys)+6});
  });
  for(let i=0;i<cents.length;i++){
    const ord=cents.slice().sort((a,b)=>{
      const da=(a.c[0]-cents[i].c[0])**2+(a.c[1]-cents[i].c[1])**2;
      const db=(b.c[0]-cents[i].c[0])**2+(b.c[1]-cents[i].c[1])**2;
      return da-db;
    });
    const g=ord.slice(0, 2+((i+p.elements.length)%3));
    const xs=g.map(x=>x.c[0]), ys=g.map(x=>x.c[1]);
    const box={x0:Math.min(...xs)-6,y0:Math.min(...ys)-8,x1:Math.max(...xs)+6,y1:Math.max(...ys)+8};
    const inn=cents.filter(x=>x.c[0]>=box.x0&&x.c[0]<=box.x1&&x.c[1]>=box.y0&&x.c[1]<=box.y1);
    add(inn, box);
  }
  if(!tries.length) return null;
  const t=tries[Math.floor(Math.random()*tries.length)];
  const correct=uniqueByKey(t.inn.map(x=>x.e.name));
  const outNames=uniqueByKey(t.out.map(x=>x.e.name)).filter(n=>!correct.some(c=>sameAns(c,n)));
  const extra=offNames(p,8);
  const wrong=uniqueByKey(outNames.concat(extra)).filter(n=>!correct.some(c=>sameAns(c,n))).slice(0, Math.max(2, 6-correct.length));
  if(wrong.length<1 || correct.length<2) return null;
  const opts=uniqueByKey(correct.concat(wrong));
  if(correct.some(c=>opts.filter(o=>sameAns(o,c)).length!==1)) return null;
  return {kind:"zone", placa:p, box:t.box, correct, options:shuffle(opts),
    prompt:"En esta zona, ¿qué estructuras encuentras?", sub:"Toca todas las que sí van · luego Listo"};
}
function makeAbsent(p){
  const on=namesOf(p);
  if(on.length<3) return null;
  const off=offNames(p,16).filter(n=>!on.some(y=>sameAns(y,n)));
  if(!off.length) return null;
  const yes=shuffle(on).slice(0,3);
  const no=off[0];
  const opts=uniqueByKey(yes.concat([no]));
  if(opts.length<4 || opts.filter(o=>sameAns(o,no)).length!==1) return null;
  return {kind:"absent", placa:p, options:shuffle(opts), answer:no,
    prompt:"¿Qué estructura NO encuentras en esta placa?"};
}

function countdown(){
  const gen=++countGen;
  let n=3;
  const tick=()=>{
    if(gen!==countGen) return;
    app.innerHTML=`<div class="count" id="screen-count"><div class="k" style="color:var(--cyan);letter-spacing:.16em;font-weight:800;font-size:12px">NIVEL ${G.level} · ${LNAMES[G.level]} · ${G.cls==="all"?"CLASES 2–6":"CLASE "+G.cls}</div><b>${n}</b><p style="color:var(--dim)">Placa silenciada. Suéltalo.</p></div>`;
    beep("go"); vibe(18);
    if(n>1){ n--; setTimeout(tick,500); }
    else setTimeout(()=>{ if(gen!==countGen) return; beep("combo");showQ();},500);
  };
  tick();
}

function packCount(q){
  if(!q) return 1;
  if(q.kind==="stpack") return (q.items||q.targets||[]).length||1;
  return 1;
}
function timerLimit(){
  if(S.timeMode==="off") return 0;
  let base = S.timeMode==="custom" ? (+S.timeSec||16) : (+((S.timeL||TIME_DEF)[G.level])||G.baseTime);
  const n=packCount(G.qs[G.i]);
  if(n>=2) base=Math.max(base, n*10, n>=4?30:0);
  if(G.level===4) return Math.max(9, base - G.combo*0.45);
  return base;
}

function showQ(){

  });

  if(nxt){ const im=new Image(); im.src=nxt.placa.imgSin; }
}

function bindPlacaImg(q, labeled){
  const p=q.placa, iw=$("iw"); if(!iw||!p) return;
  const host=iw.querySelector(".imgnest")||iw;
  const gen=++imgGen;
  let img=iw.querySelector("img.placa");
  if(!img){
    img=document.createElement("img");
    img.className="placa";
    img.alt="Placa "+p.code;
    img.decoding="async";
    host.appendChild(img);
  }
  const src=labeled? p.imgCon : p.imgSin;
  const paintMarks=()=>{
    host.querySelectorAll(".mark,.zonebox,.img-err").forEach(n=>n.remove());
    iw.querySelectorAll(":scope > .img-err").forEach(n=>n.remove());
    if(labeled) return;
    const marks=(!labeled && q.targets && q.targets.length) ? q.targets : (!labeled && q.target ? [q.target] : []);
    marks.forEach(el=>{
      if(!el||!el.poly) return;
      const [x,y]=centroid(el.poly);
      const m=document.createElement("span");
      m.className="mark";
      m.textContent=el.id||"•";
      m.style.left=x+"%"; m.style.top=y+"%";
      host.appendChild(m);
    });
    if(q.kind==="zone" && q.box){
      const b=document.createElement("div");
      b.className="zonebox";
      const x0=Math.max(0,q.box.x0), y0=Math.max(0,q.box.y0);
      const x1=Math.min(100,q.box.x1), y1=Math.min(100,q.box.y1);
      b.style.left=x0+"%"; b.style.top=y0+"%";
      b.style.width=Math.max(4,x1-x0)+"%"; b.style.height=Math.max(4,y1-y0)+"%";
      host.appendChild(b);
    }
  };
  let tries=0;
  const failBox=()=>{
    iw.querySelectorAll(".img-err").forEach(n=>n.remove());
    const box=document.createElement("div");
    box.className="img-err";
    box.innerHTML=`<div>No cargó la placa.</div><button class="go" type="button">Reintentar</button>`;
    box.querySelector("button").onclick=(ev)=>{ ev.stopPropagation(); tries=0; load(src,true); };
    iw.appendChild(box);
  };
  const load=(url,bust)=>{
    if(gen!==imgGen || !iw.isConnected) return;
    const u=bust ? url+(url.indexOf("?")>=0?"&":"?")+"r="+Date.now() : url;
    img.onload=()=>{
      if(gen!==imgGen || !iw.isConnected) return;
      iw.querySelectorAll(".img-err").forEach(n=>n.remove());
      paintMarks();
      if(typeof fitPlacas==="function") fitPlacas();
    };
    img.onerror=()=>{
      if(gen!==imgGen || !iw.isConnected) return;
      tries++;
      if(tries<3){ setTimeout(()=>load(url,true), 280*tries); return; }
      failBox();
    };
    if(!bust && img.src && img.src.endsWith(url) && img.complete && img.naturalWidth){
      iw.querySelectorAll(".img-err").forEach(n=>n.remove());
      paintMarks();
      return;
    }
    img.src=u;
  };
  load(src,false);
}

function renderBody(q, isLearn){
  const box=$("playbody");
  const cheat=!isLearn && G && G.mode==="play" && cheatOn(G.cls);
  const isCore = n => STRUCTS.some(s=>s.color==="green" && (s.name===n || s.key===norm(n)));
  if(q.kind==="zone"){
    const picked=new Set();
    box.innerHTML=`<div class="chips" id="opts">${q.options.map((o,i)=>`<button class="tchip" data-v="${i}">${esc(o)}</button>`).join("")}</div>
      <button class="go" id="okz">Listo</button>`;
    box.querySelectorAll(".tchip").forEach(b=>{
      b.onclick=()=>{ if(G.locked) return; const i=+b.dataset.v; if(picked.has(i)){picked.delete(i);b.classList.remove("on");} else {picked.add(i);b.classList.add("on");} vibe(8); };
    });
    $("okz").onclick=()=>{
      if(G.locked) return;
      const sel=[...picked].map(i=>q.options[i]);
      const ok = sameSet(sel, q.correct);
      if(isLearn) learnCheck(ok, null);
      else judge(ok,q,null,sel.join(" · ")||"(nada)");
    };
    return;
  }
  if(q.kind==="stpack"){
    box.innerHTML=q.items.map((it,i)=>`
      <div class="packrow" data-i="${i}">
        <div class="lab">(${esc(it.target.id||String(i+1))})</div>
        <div class="chips">${it.options.map((o,j)=>`<button class="tchip" data-i="${i}" data-j="${j}">${esc(o)}</button>`).join("")}</div>
      </div>`).join("")+`<button class="go" id="okz">Listo</button>`;
    box.querySelectorAll(".tchip").forEach(b=>{
      b.onclick=()=>{
        if(G.locked) return;
        const i=+b.dataset.i, j=+b.dataset.j;
        const row=box.querySelectorAll(`.tchip[data-i="${i}"]`);
        row.forEach(x=>x.classList.remove("on"));
        b.classList.add("on");
        q.items[i].pick=q.items[i].options[j];
        vibe(8);
      };
    });
    $("okz").onclick=()=>{
      if(G.locked) return;
      const detail=q.items.map(it=>it.pick!=null && sameAns(it.pick,it.answer));
      const ok=detail.every(Boolean) && q.items.every(it=>it.pick);
      const chosen=q.items.map(it=>it.pick||"(nada)").join(" · ");
      if(isLearn) learnCheck(ok, detail);
      else judge(ok,q,null,chosen);
    };
    return;
  }
  box.innerHTML=`<div class="opts" id="opts">${q.options.map((o,i)=>`<button class="opt" data-v="${i}">${esc(o)}${cheat&&isCore(o)?'<i class="hint" title="sale en muchas placas"></i>':""}</button>`).join("")}</div>`;
  box.querySelectorAll(".opt").forEach(b=>{
    b.onclick=()=>{
      if(G.locked) return;
      const val=q.options[+b.dataset.v];
      if(isLearn){
        if(q.items&&q.items[0]) q.items[0].pick=val;
        learnCheck(sameAns(val,q.answer), [sameAns(val,q.answer)]);
      } else judge(sameAns(val,q.answer),q,b,val);
    };
  });
}

function runTimer(){
  const fill=$("tfill"), bar=$("tbar"); if(!fill) return;
  if(!G.deadline){ fill.style.transform="scaleX(0)"; if(bar) bar.classList.add("off"); return; }
  const total=G.deadline-Date.now();
  const step=()=>{
    if(!G||G.locked) return;
    const left=G.deadline-Date.now();
    fill.style.transform=`scaleX(${Math.max(0,left/total)})`;
    if(left<3000) bar.classList.add("low");
    if(left<=0){ if(G.mode==="exam") examReveal(true); else judge(false,G.qs[G.i],null,"(tiempo)",true); return; }
    raf=requestAnimationFrame(step);
  };
  raf=requestAnimationFrame(step);
}

function record(p, ok, q){
  const m=S.mastery[p.code]||{ok:0,bad:0};
  if(ok) m.ok++; else m.bad++;
  S.mastery[p.code]=m;
  if(q && (q.kind==="st"||q.kind==="stpack"||q.kind==="zone"||q.kind==="absent")){
    const names = q.kind==="zone"? q.correct : q.kind==="stpack"? (q.items||[]).map(i=>i.answer) : [q.kind==="st"?q.answer:null];
    names.filter(Boolean).forEach(n=>{
      const key=norm(n);
      const sm=S.sm[key]||{ok:0,bad:0};
      if(ok) sm.ok++; else sm.bad++;
      S.sm[key]=sm;
    });
  }
  save();
}

function judge(ok,q,btn,chosen,timeout){
  if(G.locked) return;
  G.locked=true; stopTimer();
  const p=q.placa;
  if(ok){
    G.combo++; G.maxCombo=Math.max(G.maxCombo,G.combo); G.ok++;
    const left=G.deadline? Math.max(0,G.deadline-Date.now()) : 0;
    const bonus=G.isBoss&&G.deadline?Math.round(40*(left/Math.max(1,timerLimit()*1000))):0;
    G.score += Math.round((100+bonus)*(1+G.combo*0.15));
    record(p,true,q); beep(G.combo>=3?"combo":"ok"); vibe(12);
    if(btn) btn.classList.add("ok");
  } else {
    G.combo=0; G.bad++;
    if(G.isBoss) G.lives--;
    record(p,false,q); beep("bad"); vibe([30,30,30]);
    app.classList.add("shake"); setTimeout(()=>app.classList.remove("shake"),320);
    if(btn) btn.classList.add("bad");
    if($("opts")){
      $("opts").querySelectorAll(".opt,.tchip").forEach(b=>{
        const val=q.options[+b.dataset.v];
        if(q.kind==="zone"){
          if(q.correct.some(c=>sameAns(c,val))) b.classList.add("ok");
          else if(b.classList.contains("on")) b.classList.add("bad");
        } else if(sameAns(val,q.answer)) b.classList.add("ok");
        b.classList.add("lock");
      });
    }
    if(q.kind==="stpack"){
      document.querySelectorAll(".packrow .tchip").forEach(b=>{
        const it=q.items[+b.dataset.i];
        const val=it.options[+b.dataset.j];
        if(sameAns(val,it.answer)) b.classList.add("ok");
        else if(b.classList.contains("on")) b.classList.add("bad");
        b.classList.add("lock");
      });
    }
  }
  const ans=q.answer||(q.correct||[]).join(" · ")||((q.items||[]).map(i=>i.answer).join(" · "));
  G.log.push({ok,code:p.code,kind:q.kind,answer:ans,chosen:timeout?"(tiempo)":(chosen||""),dx:p.diagnosis});
  const fb=document.createElement("div");
  fb.className="fb "+(ok?"good":"nope");
  fb.id="screen-fb";
  const els=namesOf(p).slice(0,10).join(" · ")+(namesOf(p).length>10?" …":"");
  let extra="";
  if(q.kind==="zone") extra=`<div class="els"><b>En la zona:</b> ${esc((q.correct||[]).join(" · "))}</div>`;
  if(q.kind==="st") extra=`<div class="els"><b>${esc(q.target.id||"")}:</b> ${esc(q.answer)}</div>`;
  if(q.kind==="stpack") extra=`<div class="els">${(q.items||[]).map(it=>`<b>(${esc(it.target.id||"")})</b> ${esc(it.answer)}`).join(" · ")}</div>`;
  if(q.kind==="absent") extra=`<div class="els"><b>No está:</b> ${esc(q.answer)}</div>`;
  if(q.kind==="part") extra=`<div class="els"><b>Trokazo:</b> ${esc(q.answer)}</div>`;
  const manual=(S.advance||"manual")!=="auto";
  fb.innerHTML=`<h3>${ok?"¡Exacto!":(timeout?"Se acabó el tiempo.":"Mira el correcto.")}</h3>
    <div class="dx">${esc(p.diagnosis)}</div>
    ${extra}
    <div class="els"><b>Estructuras:</b> ${esc(els)}</div>
    ${manual?`<button class="go" id="btn-next">Siguiente</button>`:`<div class="tap" id="tapc">Toca para seguir</div>`}`;
  $("playbody").appendChild(fb);
  bindPlacaImg(q,true);
  const go=()=>{ if(!G||!G.locked) return; if(G.isBoss && G.lives<=0){ results(); return; } G.i++; showQ(); };
  if(manual){
    $("btn-next").onclick=(ev)=>{ ev.stopPropagation(); clearFB(); go(); };
  } else {
    let armed=false;
    setTimeout(()=>{ armed=true; }, 500);
    fbTimer=setTimeout(go, S.autoMs||2000);
    app.onclick= (ev)=>{ if(!armed) return; if(ev.target && (ev.target.id==="mute"||ev.target.id==="btn-set")) return; clearFB(); go(); };
  }
}

function results(){
  stopTimer(); app.onclick=null; setPlayLayout(false);
  const t=Math.round((Date.now()-G.t0)/1000);
  const total=G.ok+G.bad;
  const acc=total?Math.round(G.ok*100/total):0;
  const didPass=acc>=PASS && !(G.isBoss && G.lives<=0 && G.i<G.qs.length);
  const pr=prog(G.cls);
  pr[G.level]=Object.assign(pr[G.level]||{}, {best:Math.max(acc,(pr[G.level]||{}).best||0), passed: (pr[G.level]||{}).passed || didPass, acc});
  if(G.score>(S.best||0)) S.best=G.score;
  if(G.maxCombo>(S.bestCombo||0)) S.bestCombo=G.maxCombo;
  if(cheatOn(G.cls) && !pr.cheatNoted){ pr.cheatNoted=true; }
  save();
  const title = (G.isBoss && G.lives<=0 && G.i<G.qs.length) ? "TE DESPLOMASTE" :
    acc===100? "PERFECTO, LEO" : didPass? "NIVEL SUPERADO" : acc>=50? "CASI… OTRA RUN" : "SE PUEDE MEJORAR";
  const misses=G.log.filter(x=>!x.ok);
  const nxt=G.level<4 && didPass ? G.level+1 : null;
  app.innerHTML=`
    <div class="results" id="screen-results">
      <div class="k" style="color:var(--cyan);letter-spacing:.16em;font-weight:800;font-size:12px">NIVEL ${G.level} · ${LNAMES[G.level]}</div>
      <h2>${title}</h2>
      <div class="bigscore">${G.score}</div>
      <p>${G.ok} aciertos · ${G.bad} fallos · <b style="color:${didPass?"var(--ok)":"var(--yel)"}">${acc}%</b> · combo x${G.maxCombo} · ${t}s
        ${didPass && G.level<4?`<br>Desbloqueado el siguiente (≥${PASS}%).`: didPass && G.level===4?`<br>Jefe superado. A pulir tiempo y combo.`:""}</p>
      ${misses.length?`<div class="miss"><b>A repasarse:</b>${misses.slice(0,8).map(m=>`<div>${m.code}: ${esc(m.dx)}</div>`).join("")}${misses.length>8?"<div>…</div>":""}</div>`:""}
      ${nxt?`<button class="go" id="next">SIGUIENTE · ${LNAMES[nxt]}</button>`:""}
      <button class="go ${nxt?"alt":""}" id="again">OTRA VEZ</button>
      <button class="go alt" id="home">Volver al menú</button>
    </div>`;
  if(nxt) $("next").onclick=()=>start({level:nxt, cls:G.cls});
  $("again").onclick=()=>start({level:G.level, cls:G.cls});
  $("home").onclick=menu;
}

function preloadAll(){
  P.forEach(p=>{ const a=new Image(); a.src=p.imgSin; const b=new Image(); b.src=p.imgCon; });
}

function auditQuestions(nRandom){
  const prevPack=S.pack;
  const qs=[];
  const note=q=>{ if(q) qs.push(q); };
  for(const p of P){
    note(makeDx(p,P));
    for(const part of (p.parts||[])) note(makePart(p,part));
    note(makeSt(p)); note(makeZone(p)); note(makeAbsent(p));
    note(makeStPack(p,2)); note(makeStPack(p,4));
  }
  const classes=["all","2","3","4","5","6"];
  const target=Math.max(0, +nRandom||2000);
  let guard=0;
  while(qs.length<target && guard++<800){
    S.pack=[1,2,4][guard%3];
    const cls=classes[guard%classes.length];
    const lv=1+(guard%4);
    const built=buildQuestions(pool(cls), lv, cls)||[];
    built.forEach(note);
  }
  S.pack=prevPack;
  const issues=[];
  const check=(opts, answer, ctx, multi)=>{
    const list=opts||[];
    const seen=new Set();
    for(const o of list){
      const k=canon(o);
      if(seen.has(k)) issues.push({ctx, type:"dup-option", key:k, option:o, options:list.slice()});
      seen.add(k);
    }
    if(multi){
      for(const c of (answer||[])){
        const n=list.filter(o=>sameAns(o,c)).length;
        if(n!==1) issues.push({ctx, type:"correct-count", n, answer:c, options:list.slice()});
      }
    } else if(answer!=null){
      const n=list.filter(o=>sameAns(o,answer)).length;
      if(n!==1) issues.push({ctx, type:"correct-count", n, answer, options:list.slice()});
    }
  };
  const byKind={};
  for(const q of qs){
    const ctx=(q.kind||"?")+" "+((q.placa&&q.placa.code)||"");
    byKind[q.kind]=(byKind[q.kind]||0)+1;
    if(q.kind==="stpack"){
      for(const it of (q.items||[])) check(it.options, it.answer, ctx+" #"+(it.target&&it.target.id));
    } else if(q.kind==="zone") check(q.options, q.correct, ctx, true);
    else if(q.options) check(q.options, q.answer, ctx);
  }
  return {total:qs.length, issues, byKind};
}

window.FB={ start, menu, showMap, showSettings, showLearnPick, startLearn,
  showExamSetup, startExam, showExamQ, examReveal, showQ, pickExamPlacas, examTarget, examProgressOn, setExamKind, switchSet, openLightbox, closeLightbox, auditQuestions, canon, sameAns, pickOptions, makeDx, makePart, makeSt, makeZone, makeAbsent,
  get state(){return G;}, getS:()=>S, setS(p){ Object.assign(S,p); save(); },
  unlockAll(){ S.free=true; save(); } };
bindDataset();
S=load();
discoverExtraSets();
preloadAll();
menu();
})();
